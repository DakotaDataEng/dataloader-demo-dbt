version: 2

models:
  - name: stg_leases
    description: The lease list from the land system with snake case names. One row per lease. Synthetic Demo data.
    columns:
      - name: lease_id
        description: Unique lease number.
        tests: [unique, not_null]
      - name: lease_name
        description: Demo lease name.
      - name: county
        description: County the lease is in.
      - name: acres
        description: Lease size in acres.
      - name: effective_date
        description: Date the lease took effect.
      - name: expiry_date
        description: Date the lease expires unless held.
      - name: modified_at
        description: When the row last changed in the source, in UTC.
  - name: stg_lease_interests
    description: Each owner's decimal interest in each lease, with snake case names. Synthetic Demo data.
    columns:
      - name: lease_interest_id
        description: Unique row number.
        tests: [unique, not_null]
      - name: lease_id
        description: The lease.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_leases')
                field: lease_id
      - name: owner_id
        description: The owner.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_owners')
                field: owner_id
      - name: decimal_interest
        description: The owner's share of the lease as a decimal.
      - name: modified_at
        description: When the row last changed in the source, in UTC.
  - name: stg_owners
    description: The owner list from the land system with snake case names. One row per owner. Synthetic Demo data.
    columns:
      - name: owner_id
        description: Unique owner number.
        tests: [unique, not_null]
      - name: owner_name
        description: Demo owner name.
      - name: owner_type
        description: Individual, Trust or Company.
        tests:
          - accepted_values:
              arguments:
                values: [Individual, Trust, Company]
      - name: modified_at
        description: When the row last changed in the source, in UTC.
  - name: stg_well_leases
    description: The well to lease link kept by accounting, with snake case names. One row per well. Synthetic Demo data.
    columns:
      - name: well_id
        description: The well.
        tests: [unique, not_null]
      - name: lease_id
        description: The lease the well sits on.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_leases')
                field: lease_id
      - name: cost_center
        description: The accounting code the well is charged to, such as CC-0001.
      - name: modified_at
        description: When the row last changed in the source, in UTC.
