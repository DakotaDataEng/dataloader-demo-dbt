version: 2

models:
  - name: stg_allocations
    description: The allocation load with snake case names.
    columns:
      - name: allocation_id
        description: Unique allocation number.
        tests: [unique, not_null]
      - name: well_id
        description: The well the volumes are allocated to.
        tests: [not_null]
      - name: production_date
        description: The production day being allocated.
  - name: fct_production
    description: Allocated oil, gas and water per well per production day, with the well's name and field.
    columns:
      - name: allocation_id
        description: Unique allocation number.
        tests: [unique, not_null]
      - name: api_number
        description: API well number. Demo numbers start at 42-000-00001.
      - name: allocated_oil_bbl
        description: Allocated oil, in barrels.
