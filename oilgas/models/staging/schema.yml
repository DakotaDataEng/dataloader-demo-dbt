version: 2

models:
  - name: stg_wells
    description: The well list from field data capture with snake case names. One row per well. Synthetic Demo data.
    columns:
      - name: well_id
        description: Unique well number.
        tests: [unique, not_null]
      - name: api_number
        description: API well number. Demo numbers start at 42-000-00001.
      - name: well_name
        description: Demo well name.
      - name: operator
        description: Company that operates the well.
      - name: field
        description: Field the well produces from.
      - name: spud_date
        description: Date drilling began.
      - name: status
        description: Well status, such as Producing.
      - name: modified_at
        description: When the row last changed in the source, in UTC.
  - name: stg_daily_volumes
    description: Volumes measured in the field, with snake case names. One row per well per production day. Synthetic Demo data.
    columns:
      - name: volume_id
        description: Unique row number.
        tests: [unique, not_null]
      - name: well_id
        description: The well the volumes were measured on.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_wells')
                field: well_id
      - name: production_date
        description: The production day.
        tests: [not_null]
      - name: field_oil_bbl
        description: Oil measured in the field, in barrels.
      - name: field_gas_mcf
        description: Gas measured in the field, in thousand cubic feet.
      - name: field_water_bbl
        description: Water measured in the field, in barrels.
      - name: modified_at
        description: When the row last changed in the source, in UTC.
  - name: stg_allocations
    description: The allocation load from production accounting with snake case names. One row per well per production day. Synthetic Demo data.
    columns:
      - name: allocation_id
        description: Unique allocation number.
        tests: [unique, not_null]
      - name: well_id
        description: The well the volumes are allocated to.
        tests: [not_null]
      - name: production_date
        description: The production day being allocated.
      - name: allocated_oil_bbl
        description: Allocated oil, in barrels.
      - name: allocated_gas_mcf
        description: Allocated gas, in thousand cubic feet.
      - name: allocated_water_bbl
        description: Allocated water, in barrels.
      - name: modified_at
        description: When the row last changed in the source, in UTC.
