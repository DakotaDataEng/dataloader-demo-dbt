version: 2
models:
  - name: order_sales
    description: One row per order that was not cancelled, with its revenue, merchandise cost and units sold. Cost comes from the order lines at the price paid when the order was placed.
    columns:
      - name: order_id
        description: Unique order number.
        data_tests: [not_null, unique]
      - name: customer_id
        description: The customer who placed the order.
        data_tests: [not_null]
      - name: sales_date
        description: Business date of the order in Edmonton time.
      - name: channel
        description: Where the order was placed, web or store.
        data_tests:
          - accepted_values:
              arguments:
                values: ['web']
      - name: region
        description: Province of the customer who placed the order.
      - name: order_revenue
        description: Order total as charged to the customer.
      - name: merchandise_revenue
        description: Sum of the order line amounts.
      - name: units_sold
        description: Total units across the order lines.
      - name: category_count
        description: Number of product categories on the order.
  - name: daily_sales
    description: Sales for each Edmonton business date. Cancelled orders are left out.
    columns:
      - name: sales_date
        description: Business date in Edmonton time.
        data_tests: [not_null, unique]
      - name: order_count
        description: Orders placed that day.
      - name: customer_count
        description: Distinct customers who ordered that day.
      - name: gross_revenue
        description: Total order revenue for the day.
      - name: merchandise_revenue
        description: Revenue from merchandise lines.
      - name: merchandise_cost
        description: Cost of the merchandise sold.
      - name: gross_margin
        description: Merchandise revenue minus merchandise cost.
      - name: units_sold
        description: Units sold that day.
  - name: customer_lifetime_value
    description: One row per customer with their order count, revenue and margin to date. Customers who have never ordered are included with zero totals.
    columns:
      - name: customer_id
        description: Unique customer number.
        data_tests: [not_null, unique]
      - name: demo_name
        description: Display name of the customer.
      - name: region
        description: Province where the customer is based.
      - name: order_count
        description: Orders placed to date.
      - name: lifetime_revenue
        description: Total order revenue to date.
      - name: lifetime_margin
        description: Merchandise margin earned to date.
      - name: first_order_date
        description: Date of the first order. Empty if the customer has not ordered.
      - name: last_order_date
        description: Date of the latest order. Empty if the customer has not ordered.
  - name: recent_orders
    description: Orders from the 30 days up to the newest order, one row per order. It builds incrementally, so each run adds new orders and updates the ones that changed since the last run. Cancelled orders are kept, with their status.
    columns:
      - name: order_id
        description: Unique order number.
        data_tests: [not_null, unique]
      - name: customer_id
        description: The customer who placed the order.
      - name: ordered_at
        description: When the customer placed the order.
      - name: status
        description: Where the order stands, processing, completed or cancelled.
      - name: channel
        description: Where the order was placed, web or store.
      - name: total_amount
        description: Order total as charged to the customer.
      - name: updated_at
        description: When the order row last changed in the source system.
  - name: weekly_sales
    description: Sales for each week, Monday to Sunday, from the daily totals.
    columns:
      - name: sales_week
        description: Monday that starts the week.
        data_tests: [not_null, unique]
      - name: order_count
        description: Orders placed that week.
      - name: gross_revenue
        description: Total order revenue for the week.
      - name: gross_margin
        description: Merchandise revenue minus merchandise cost for the week.
      - name: units_sold
        description: Units sold that week.
  - name: region_sales
    description: Sales for each province and channel.
    columns:
      - name: region
        description: Province of the customers who ordered.
        data_tests: [not_null]
      - name: channel
        description: Where the orders were placed, web or store.
      - name: order_count
        description: Orders placed.
      - name: gross_revenue
        description: Total order revenue.
      - name: units_sold
        description: Units sold.
      - name: average_categories
        description: Product categories on an average order.
  - name: customer_segments
    description: Each customer's spending band, high from 5,000, medium from 1,000, otherwise low.
    columns:
      - name: customer_id
        description: Unique customer number.
        data_tests: [not_null, unique]
      - name: demo_name
        description: Display name of the customer.
      - name: region
        description: Province where the customer is based.
      - name: lifetime_revenue
        description: Total order revenue to date.
      - name: segment
        description: Spending band, high, medium or low.
  - name: order_events
    description: The latest state of every order, one row per order. It builds incrementally and adds new columns to the deployed table when the model gains them.
    columns:
      - name: order_id
        description: Unique order number.
        data_tests: [not_null, unique]
      - name: customer_id
        description: The customer who placed the order.
      - name: status
        description: Where the order stands, processing, completed or cancelled.
      - name: total_amount
        description: Order total as charged to the customer.
      - name: updated_at
        description: When the order row last changed in the source system.
